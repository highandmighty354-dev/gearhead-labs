<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e12">
<meta name="description" content="Gearhead Labs — The Automotive Math Encyclopedia. Free automotive engineering calculators and reference tools.">
<title>Gearhead Labs — The Automotive Math Encyclopedia | The Science of Speed</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e12}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0d0e12}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#0d0e12;color:#d7a11f;font:800 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.16em;text-transform:uppercase;z-index:2;transition:opacity .25s ease}
#boot.hide{opacity:0;pointer-events:none}.mark{font-size:20px;margin-bottom:8px;color:#f5f6f8;letter-spacing:.08em}#boot span{display:block;text-align:center}
</style>
</head>
<body>
<div id="boot"><div><div class="mark">GEARHEAD LABS</div><span>THE AUTOMOTIVE MATH ENCYCLOPEDIA</span></div></div>
<iframe id="app" title="Gearhead Labs Automotive Math Encyclopedia" src="E1.1.0_Gearhead_Labs_Automotive_Math_Encyclopedia.html"></iframe>
<script>
(function(){
const frame=document.getElementById('app'),boot=document.getElementById('boot');
function repairRegistry(w){try{if(typeof w.CALCS==='undefined')return;const all=[],seen=new Set(),sources=[];function isCalc(c){return c&&typeof c==='object'&&typeof c.id==='string'&&c.id.length>0&&(typeof c.name==='string'||typeof c.label==='string')&&(typeof c.cat==='string'||typeof c.category==='string'||typeof c.lab==='string')}function add(list,source){if(!Array.isArray(list))return;let added=0;list.forEach(function(c){if(isCalc(c)&&!seen.has(c.id)){seen.add(c.id);all.push(c);added++}});if(added)sources.push({source:source,added:added})}try{add(w.GH_MASTER_CALCS||[],'GH_MASTER_CALCS')}catch(e){}try{add(w.GH_E1_CALCS||[],'GH_E1_CALCS')}catch(e){}try{add(w.GH_E101_CALCS||[],'GH_E101_CALCS')}catch(e){}try{add(w.CALCS,'CALCS-original')}catch(e){}try{Object.keys(w).forEach(function(k){if(k==='CALCS'||k==='GH_MASTER_CALCS'||k==='GH_E1_CALCS'||k==='GH_E101_CALCS')return;let v;try{v=w[k]}catch(e){return}if(Array.isArray(v)&&v.some(isCalc))add(v,k)})}catch(e){}w.CALCS.splice(0,w.CALCS.length,...all);try{w.GH_MASTER_CALCS=all}catch(e){}if(typeof w.ghBuildNav==='function')w.buildNav=w.ghBuildNav;if(typeof w.buildNav==='function')w.buildNav(w.document.getElementById('search-input')?.value||'');var n=w.document.querySelector('.gh-calculator-count strong');if(n)n.textContent=String(all.filter(function(c){return c.id!=='dashboard'}).length);var categories={};all.forEach(function(c){var cat=c.cat||c.category||c.lab||'UNCATEGORIZED';categories[cat]=(categories[cat]||0)+1});w.__GH_FINAL_REGISTRY_COUNT=all.filter(function(c){return c.id!=='dashboard'}).length;w.__GH_CALCULATOR_AUDIT={total:w.__GH_FINAL_REGISTRY_COUNT,uniqueIds:seen.size,sources:sources,categories:categories};w.__GH_CALCULATOR_AUDIT.expectedTotal=575;w.__GH_CALCULATOR_AUDIT.totalMatchesExpected=(w.__GH_FINAL_REGISTRY_COUNT===575);w.__GH_CALCULATOR_AUDIT.expectedLabCounts={GASOLINE:44,DIESEL:42,EV:24,TOWING:25,UNIVERSAL:439}}catch(e){console.error('Gearhead Labs registry audit/repair failed',e)}}
function installAccordion(w){try{const d=w.document;if(!d||d.__GH_ACCORDION_INSTALLED)return;d.__GH_ACCORDION_INSTALLED=true;const s=d.createElement('style');s.id='GH_ACCORDION_RUNTIME_FIX';s.textContent='.gh-cat-block .gh-cat-items{transition:none!important}.gh-cat-block.open .gh-cat-items{display:block!important}.gh-cat-block.open .gh-cat-head i{transform:rotate(180deg);color:#d7a11f}';d.head.appendChild(s);d.addEventListener('click',function(ev){const target=ev.target&&ev.target.closest?ev.target.closest('.gh-cat-head'):null;if(!target)return;const block=target.closest('.gh-cat-block');if(!block)return;const panel=block.querySelector('.gh-cat-items');if(!panel)return;ev.preventDefault();ev.stopImmediatePropagation();const computed=w.getComputedStyle(panel);const isOpen=block.classList.contains('open')||(!panel.hidden&&computed.display!=='none'&&computed.visibility!=='hidden'&&panel.offsetHeight>0);if(isOpen){block.classList.remove('open');panel.hidden=true;panel.style.setProperty('display','none','important');target.setAttribute('aria-expanded','false')}else{block.classList.add('open');panel.hidden=false;panel.style.setProperty('display','block','important');target.setAttribute('aria-expanded','true')}},true)}catch(e){console.error('Gearhead Labs accordion repair failed',e)}}
function installCalculatorClickRepair(w){try{const d=w.document;if(!d||d.__GH_CALC_CLICK_REPAIR)return;d.__GH_CALC_CLICK_REPAIR=true;d.addEventListener('click',function(ev){try{if(!Array.isArray(w.CALCS)||typeof w.renderCalc!=='function')return;let el=ev.target;if(!el)return;let calc=null;const anchor=el.closest&&el.closest('a[href*="?calc="]');if(anchor){try{const raw=anchor.getAttribute('href')||'';const match=raw.match(/[?&]calc=([^&#]+)/);if(match){const id=decodeURIComponent(match[1]);calc=w.CALCS.find(function(c){return c&&c.id===id})}}catch(e){}}if(!calc){for(let depth=0;el&&depth<7;depth++,el=el.parentElement){const explicit=el.getAttribute&&el.getAttribute('data-calc-id');if(explicit){calc=w.CALCS.find(function(c){return c&&c.id===explicit});if(calc)break}const text=(el.textContent||'').replace(/[›→]/g,'').replace(/\s+/g,' ').trim();if(text){calc=w.CALCS.find(function(c){const name=(c.name||c.label||'').replace(/\s+/g,' ').trim();return name&&text===name});if(calc)break}}}if(!calc)return;ev.preventDefault();ev.stopImmediatePropagation();w.renderCalc(calc.id,true)}catch(e){console.error('Gearhead Labs calculator click repair failed',e)}},true)}catch(e){console.error('Gearhead Labs calculator click repair install failed',e)}}
function injectMathQA(w,done){try{const s=w.document.createElement('script');s.src='qa-math-corrections.js?v=2';s.onload=function(){done&&done()};s.onerror=function(){console.error('Gearhead Labs QA corrections could not load');done&&done()};w.document.head.appendChild(s)}catch(e){console.error(e);done&&done()}}
function repair(){try{const w=frame.contentWindow;injectMathQA(w,function(){repairRegistry(w);installAccordion(w);installCalculatorClickRepair(w);setTimeout(function(){repairRegistry(w);installAccordion(w);installCalculatorClickRepair(w)},250);setTimeout(function(){repairRegistry(w);installAccordion(w);installCalculatorClickRepair(w)},1000)})}catch(e){console.error(e)}boot.classList.add('hide')}
frame.addEventListener('load',repair);
})();
</script>
<script src="navigation-ux.js?v=5"></script>
</body>
</html>
