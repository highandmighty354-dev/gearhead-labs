<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="description" content="Gearhead Labs Engineering Encyclopedia: search engineering terms, abbreviations and shop language, and find the calculators that use them.">
<title>Engineering Encyclopedia | Gearhead Labs</title>
<style>
:root{--bg:#0d0e12;--surface:#15171d;--card:#1a1d24;--card-hover:#20232b;--border:#2a2e38;--text:#f5f6f8;--text-2:#c3c8d1;--muted:#8c96a5;--input:#0f1013;--gold:#d7a11f;--gold-hi:#f2c65d;--gold-wash:rgba(217,154,22,.12);--info:#4fb8e8;--green:#4dd99a;--black:#050607;--line:rgba(255,255,255,.075);--line-2:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--black);color:var(--text);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--gold-hi)}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.85em;color:var(--text-2)}
.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:9;background:var(--card);padding:8px 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0a0c0f}
.mark{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--gold)}.mark span{display:block;color:var(--text);letter-spacing:.06em;font-size:16px}
header a{font-size:14px;white-space:nowrap}
#enc{max-width:1200px;margin:0 auto;padding:12px 16px 40px}
.bar{position:sticky;top:0;z-index:3;background:var(--black);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}.search label{position:absolute;left:-9999px}
#q{flex:1;min-width:0;background:var(--input);border:1px solid var(--line-2);border-radius:10px;color:var(--text);padding:11px 12px;font-size:16px}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.filters label{display:flex;flex-direction:column;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
select{margin-top:3px;background:var(--input);border:1px solid var(--line-2);border-radius:8px;color:var(--text);padding:8px;font-size:14px;min-width:0;width:100%}
#fbox>summary{display:none}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
#letters{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.L{min-width:28px;height:28px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;padding:0 4px}
.L:disabled{opacity:.3;cursor:default}
.notice{margin:8px 0 0;padding:8px 10px;border-radius:8px;font-size:13px;background:var(--gold-wash);border:1px solid rgba(217,154,22,.35);color:var(--text)}
.notice-sort{background:rgba(79,184,232,.08);border-color:rgba(79,184,232,.35)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;margin-top:12px;align-items:start}
.grp{font-size:13px;letter-spacing:.12em;color:var(--gold);margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.items{list-style:none;margin:0;padding:0}
.item{display:block;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--text);border:1px solid transparent}
.item:hover{background:var(--card-hover)}.item.sel{background:var(--card);border-color:var(--line-2)}
.item .t{font-weight:600;margin-right:6px}.item .d{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.b{display:inline-block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-right:4px;vertical-align:2px;border:1px solid var(--line-2);color:var(--text-2)}
.b-concept{color:var(--gold-hi);border-color:rgba(242,198,93,.4)}.b-abbreviation{color:var(--info);border-color:rgba(79,184,232,.4)}.b-prem{color:#111;background:var(--gold);border-color:var(--gold)}
#entry{position:sticky;top:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:calc(100vh - 200px);overflow:auto}
#entry h2{margin:0 0 4px;font-size:22px;line-height:1.25;overflow-wrap:anywhere}#entry h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
#entry p,#entry li{overflow-wrap:anywhere}.def{font-size:16px}.dist{color:var(--text-2)}
#entry ul{margin:4px 0;padding-left:18px}.rt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.note{color:var(--text-2)}
.btn{display:inline-block;background:var(--gold);color:#111;font-weight:700;text-decoration:none;padding:9px 14px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:12px}.u{color:var(--muted)}
.rev{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:16px}
.back{display:none;background:none;border:0;color:var(--gold-hi);font-size:15px;padding:0 0 8px;cursor:pointer}
.empty{padding:16px;border:1px dashed var(--line-2);border-radius:10px;color:var(--text-2)}
.empty button{background:var(--card);color:var(--text);border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
.hint{color:var(--muted)}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
@media (max-width:760px){
  .bar{position:static}
  #fbox>summary{display:list-item;cursor:pointer;margin-top:8px;color:var(--gold-hi);font-size:14px;font-weight:600}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols{display:block}
  #entry{position:static;max-height:none;margin-top:12px}
  body:not(.has-entry) #entry{display:none}
  body.has-entry #listwrap,body.has-entry #letters{display:none}
  .back{display:block}
  #letters{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .L{flex:0 0 auto;min-width:32px;height:32px}
}
</style>
</head>
<body>
<a class="skip" href="#q">Skip to search</a>
<header>
  <div class="mark">GEARHEAD LABS<span>Engineering Encyclopedia</span></div>
  <a href="index.html" target="_top">← Calculators</a>
</header>
<main id="enc" aria-busy="true">
  <div class="bar">
    <form class="search" role="search" onsubmit="return false">
      <label for="q">Search terms, abbreviations, shop language or calculators</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search: DCR, posi, wheel rate, u-joint…" aria-describedby="count">
    </form>
    <details id="fbox" open><summary>Filters &amp; sort</summary>
    <div class="filters">
      <label>Type<select id="f-type"><option value="">All types</option><option value="concept">Concepts</option><option value="abbreviation">Abbreviations</option><option value="calculator">Calculators</option></select></label>
      <label>Lab<select id="f-lab"><option value="">All labs</option></select></label>
      <label>Section<select id="f-cat"><option value="">All sections</option></select></label>
      <label>Access<select id="f-tier"><option value="">Free and Premium</option><option value="free">Free</option><option value="premium">Premium</option></select></label>
      <label>Sort<select id="f-sort"></select></label>
    </div>
    </details>
    <div class="meta"><span id="count" aria-live="polite">Loading…</span><span id="stats"></span></div>
    <nav id="letters" aria-label="Jump to letter"></nav>
    <div id="notices"></div>
  </div>
  <div class="cols">
    <section id="listwrap" aria-label="Entries"><div id="list"></div></section>
    <section id="entry" aria-live="polite" aria-label="Entry"></section>
  </div>
</main>
<footer><p id="sort-note"></p><p>Concept definitions are drafts awaiting review and cite no sources yet. Calculator entries come from the calculator catalogue and the calculator pages. Premium tools open only for Premium members.</p></footer>
<script src="encyclopedia.js?v=20261026-0100"></script>
</body>
</html>
