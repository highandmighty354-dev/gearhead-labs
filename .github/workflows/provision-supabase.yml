# Gearhead Labs — Supabase provisioning (MANUAL ONLY, APPROVAL-GATED)
#
# Applies the approved 19-file migration package (0001-0409), read directly from the repository at the
# pinned commit below (c69ec51, the commit that adds 0409, M1 decision D1; prepared for owner review, not applied).
# No SQL is retyped or transcribed anywhere.
#
# Safety design
#   * Runs only when a person clicks "Run workflow" (workflow_dispatch). No push / PR triggers.
#   * Default mode is dry-run. Apply must be chosen explicitly AND confirmed by typing APPLY.
#   * The target database is decided by the GitHub Environment you pick (rehearsal / production);
#     its connection settings live only in that Environment. Nothing is hard-coded here.
#   * You must also type the target project ref; the run stops if it does not match the Environment.
#   * Every job that can reach a database uses the Environment, so it waits for a required
#     reviewer's approval before any credential is released.
#   * The package is verified before any credential is touched: exact commit, exact 19 file names,
#     exact order, exact SHA-256 of every file, and the frozen-source hashes.
#   * The dry run FAILS (red) unless the pending list is positively verified (pending_gate below):
#     production must show exactly PRODUCTION_EXPECTED_PENDING (this release: only 0409); a rehearsal
#     project must show a non-empty exact end of the approved order (fresh project: all 19) or an
#     explicit "up to date". Unparseable, empty, duplicated, reordered or skipped lists fail.
#   * Apply refuses to run unless the target's pending list is exactly the END of the approved order:
#     all 19 files for a fresh, empty project, or only the files after the last one already applied
#     (production at 0408 -> only 0409). It never applies a reordered set or skips a file. The CLI also
#     refuses if the target's recorded history contains a version that is not in this package.
#   * Credentials: one Environment secret (database password). It is masked in logs and never printed.

name: Provision Supabase (manual, gated)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environment to use. Its settings decide which Supabase project is touched."
        type: choice
        options: [rehearsal, production]
        default: rehearsal
      mode:
        description: "dry-run = show what would be applied, change nothing. apply = change the database."
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirm_project_ref:
        description: "Safety check: type the target project ref exactly (e.g. abcdefghijklmnopqrst)."
        type: string
        required: true
      confirm_apply:
        description: "Apply mode only: type APPLY in capitals. Leave blank for dry-run."
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-provision-${{ inputs.target }}
  cancel-in-progress: false

env:
  PINNED_SHA: c69ec51e47af7d2120ad82a4f8aa6a0e7522de67
  SUPABASE_CLI_VERSION: 2.119.0
  # What production must show pending for THIS release (newline-separated, in order). Production is at 0408.
  # Change it only together with a new pinned package.
  PRODUCTION_EXPECTED_PENDING: "0409_formula_versions_fuel_pump_validity.sql"
  # The pending-migration gate, defined once and loaded by the dry-run and apply jobs (they check out the
  # pinned commit, which has no helper scripts). Tested by premium/tests/workflow-pending-gate.test.py.
  PENDING_GATE_SH: |
    # Pending-migration gate (fail closed). Defined once, here, and loaded by the dry-run and apply jobs.
    # Parses ONLY the exact lines the Supabase CLI 2.119.0 prints for `db push --dry-run`
    # (apps/cli/src/command-internal/db-push-core.ts):
    #   "DRY RUN: migrations will *not* be pushed to the database."      once, proves the dry-run path
    #   "Would push these migrations:" then one " • <file>.sql" per line  the pending list
    #   "Remote database is up to date."                                  explicit: nothing pending
    # A file name anywhere else in the output (log text, errors, warnings) is never read as pending.
    #
    # pending_gate TARGET CLI_OUTPUT_FILE APPROVED_LIST_FILE PRODUCTION_EXPECTED
    #   APPROVED_LIST_FILE: the approved file names, one per line, in apply order (the pinned package).
    #   PRODUCTION_EXPECTED: newline-separated list production must show pending, exactly (this release: 0409 only).
    # Policy:
    #   production  pending must equal PRODUCTION_EXPECTED exactly; "up to date" or anything else fails.
    #   rehearsal   pending must be a non-empty exact END of the approved order (a fresh, empty project: all
    #               19 files); an explicit "up to date" passes as "nothing pending".
    #   other       fails.
    # Prints "pending: <file>" lines, then "verdict: PASS <why>" (return 0) or "verdict: FAIL <why>" (return 1).
    pending_gate() {
      local target="$1" out="$2" approved_file="$3" prod_expected="$4"
      local LC_ALL=C
      local dry_line='DRY RUN: migrations will *not* be pushed to the database.'
      local head_line='Would push these migrations:'
      local up_line='Remote database is up to date.'
      local bullet_re='^ • ([0-9]{4}_[a-z0-9_]+\.sql)$'
      local clean approved line state=none n_bullets=0 dup suffix k
      local -a pending=()

      if [ ! -s "$out" ]; then echo "verdict: FAIL the CLI output is missing or empty"; return 1; fi
      if [ ! -s "$approved_file" ]; then echo "verdict: FAIL the approved list is missing or empty"; return 1; fi
      approved="$(grep -v '^$' "$approved_file" || true)"
      if [ -n "$(printf '%s\n' "$approved" | sort | uniq -d)" ]; then echo "verdict: FAIL the approved list has duplicates"; return 1; fi
      # strip colour codes and carriage returns (the CLI prints no colour in CI; this is defence only)
      clean="$(sed -e $'s/\x1b\\[[0-9;]*[A-Za-z]//g' -e $'s/\r$//' "$out")"

      if [ "$(printf '%s\n' "$clean" | grep -cxF -- "$dry_line")" != 1 ]; then
        echo "verdict: FAIL the output does not confirm a dry run (the DRY RUN line must appear exactly once)"; return 1; fi
      if printf '%s\n' "$clean" | grep -qE '^Would (seed|create)'; then
        echo "verdict: FAIL the dry run would also seed data or create roles"; return 1; fi
      local n_head n_up
      n_head="$(printf '%s\n' "$clean" | grep -cxF -- "$head_line" || true)"
      n_up="$(printf '%s\n' "$clean" | grep -cxF -- "$up_line" || true)"
      if [ "$n_head" = 1 ] && [ "$n_up" = 0 ]; then
        while IFS= read -r line; do
          if [ "$state" = none ]; then [ "$line" = "$head_line" ] && state=list; continue; fi
          if [ "$state" = list ]; then
            if [[ $line =~ $bullet_re ]]; then pending+=("${BASH_REMATCH[1]}"); else state=ended; fi
          fi
        done <<< "$clean"
        # every bullet line in the whole output must belong to that one list
        n_bullets="$(printf '%s\n' "$clean" | grep -c '^ • ' || true)"
        if [ "${#pending[@]}" = 0 ]; then echo "verdict: FAIL the pending list after the header is empty or malformed"; return 1; fi
        if [ "$n_bullets" != "${#pending[@]}" ]; then
          echo "verdict: FAIL the output has list entries outside the pending list, or an entry that is not a migration file name"; return 1; fi
      elif [ "$n_up" = 1 ] && [ "$n_head" = 0 ]; then
        if printf '%s\n' "$clean" | grep -q '^ • '; then echo "verdict: FAIL 'up to date' together with list entries"; return 1; fi
        if [ "$target" = rehearsal ]; then echo "verdict: PASS nothing pending: the CLI reported the database up to date"; return 0; fi
        echo "verdict: FAIL the CLI reported the database up to date, but $target must have exactly: $(printf '%s' "$prod_expected" | tr '\n' ' ')"; return 1
      else
        echo "verdict: FAIL the pending list cannot be read reliably (header lines: $n_head, up-to-date lines: $n_up)"; return 1
      fi

      printf 'pending: %s\n' "${pending[@]}"
      local plist; plist="$(printf '%s\n' "${pending[@]}")"
      dup="$(printf '%s\n' "$plist" | sort | uniq -d)"
      if [ -n "$dup" ]; then echo "verdict: FAIL duplicate pending entries: $(printf '%s' "$dup" | tr '\n' ' ')"; return 1; fi
      while IFS= read -r line; do
        if ! printf '%s\n' "$approved" | grep -qxF -- "$line"; then echo "verdict: FAIL $line is not in the approved package"; return 1; fi
      done <<< "$plist"
      k="${#pending[@]}"
      suffix="$(printf '%s\n' "$approved" | tail -n "$k")"
      if [ "$(printf '%s\n' "$approved" | wc -l)" -lt "$k" ] || [ "$suffix" != "$plist" ]; then
        echo "verdict: FAIL the pending list is not the exact end of the approved order (a file is skipped or the order differs)"; return 1; fi
      case "$target" in
        production)
          if [ -z "$(printf '%s' "$prod_expected" | tr -d '[:space:]')" ]; then echo "verdict: FAIL no expected production pending list is configured"; return 1; fi
          if [ "$plist" != "$(printf '%s\n' "$prod_expected" | grep -v '^$')" ]; then
            echo "verdict: FAIL production must have exactly: $(printf '%s' "$prod_expected" | tr '\n' ' ')"; return 1; fi
          echo "verdict: PASS exactly the expected production pending list"; return 0 ;;
        rehearsal)
          echo "verdict: PASS the pending list is an exact end of the approved order ($k of $(printf '%s\n' "$approved" | wc -l) files)"; return 0 ;;
        *) echo "verdict: FAIL unknown target '$target'"; return 1 ;;
      esac
    }

    # uptodate_gate CLI_OUTPUT_FILE: after APPLY, the verification dry run must positively say nothing is pending.
    uptodate_gate() {
      local out="$1" clean LC_ALL=C
      if [ ! -s "$out" ]; then echo "verdict: FAIL the CLI output is missing or empty"; return 1; fi
      clean="$(sed -e $'s/\x1b\\[[0-9;]*[A-Za-z]//g' -e $'s/\r$//' "$out")"
      if [ "$(printf '%s\n' "$clean" | grep -cxF -- 'DRY RUN: migrations will *not* be pushed to the database.')" != 1 ]; then
        echo "verdict: FAIL the output does not confirm a dry run"; return 1; fi
      if [ "$(printf '%s\n' "$clean" | grep -cxF -- 'Remote database is up to date.')" = 1 ] \
         && ! printf '%s\n' "$clean" | grep -qxF -- 'Would push these migrations:' \
         && ! printf '%s\n' "$clean" | grep -q '^ • '; then
        echo "verdict: PASS the CLI reported the database up to date"; return 0; fi
      echo "verdict: FAIL the database is not positively reported up to date"; return 1
    }

jobs:
  verify-package:
    name: Verify pinned migration package (no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse apply without typed confirmation
        if: inputs.mode == 'apply'
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          if [ "$CONFIRM_APPLY" != "APPLY" ]; then
            echo "::error::Apply mode requires typing APPLY in the confirm_apply box. Nothing was done."
            exit 1
          fi

      - name: Check out the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SHA }}
          persist-credentials: false

      - name: Verify commit, file list, order and checksums
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          cat > "$RUNNER_TEMP/manifest.sha256" <<'EOF'
          e6ff6301b302bd794ee6bdb1ddc65cc2ebd9de9c8e27c141ae5403b2092432e6  supabase/migrations/0001_enums.sql
          5332f1396283b1d106cfe9c719cedae24069bef317e738b760a76c2131b3c947  supabase/migrations/0002_tables.sql
          e1e241f7422c9040b2b8bd6ddaecafb2b55bc4b3a4a4d375546b7ef7f3c59e3a  supabase/migrations/0003_constraints_triggers.sql
          8663ab2b5e6e4a5f16d6d781d1e26c915197541a7ce8e083d8a27eb07c27fcdb  supabase/migrations/0004_rls.sql
          7bebd26f100c9f8010539a9052988d28b289349d89ed3abd4ff4431dabfdd14f  supabase/migrations/0005_reference_seed.sql
          a3256a08de2f25e7c52f0f26cb6be32f1b16b999b29e6b3c0abf65e7d773b5b4  supabase/migrations/0101_test_setups.sql
          7ba5b02fd016c45b45043e3358dd4683076216eae028a3f3ca597e886759dea4  supabase/migrations/0102_test_setups_triggers.sql
          b1f778b9d13117a270f8240702bb2678543552a54f6f91f55acef478104bfae8  supabase/migrations/0103_test_setups_rls.sql
          ccc6bb56f070f67b972026972a3ec1c963c180c045996ff1551ffa6be485ae09  supabase/migrations/0201_value_write_boundary.sql
          b5f7fbe495403d5367fb5dde2850bcbf20d46295997e928dc25bae1987c1bea1  supabase/migrations/0301_value_foundation_v1_seed.sql
          6174b0f7b2b43022fbda2248f2e824c082062d50fcdf54e5a0c69893ea10fc62  supabase/migrations/0401_automotive_only.sql
          f962e8f00b2830957b90bf40406eaf1b91469dacde9292028d8d21085c3312c7  supabase/migrations/0402_premium_entitlements.sql
          3309328906074246bb3c13dacb2818107d3a926260352b72581a9180f5c5c35f  supabase/migrations/0403_premium_profiles.sql
          0c89dd3a1b3949b998cedb0fe075db78668878ff2216a32d00eddbd07c0bcc6e  supabase/migrations/0404_premium_garage.sql
          c63a2d1803b0a90e685e64688943602064a111db862244e41d50f89badde49b0  supabase/migrations/0405_premium_saved_calculations.sql
          75eccb9260a0265be95bbe5f5d34981ba482ad08bc4ff5ee14225839e1e43f43  supabase/migrations/0406_premium_engineering_analyses.sql
          e5e0cb582c9ed19c17134bace602f539697ae3f10af813f08486de6a5181de70  supabase/migrations/0407_premium_product_model.sql
          df92a3e050bc7cbc46d5e1c1d6fe3822a7a82db58a2ebc5fe3965138380c4c49  supabase/migrations/0408_formula_versions_corrected_formulas.sql
          29cbdcd08bda08630126e65f89a99f1226766d8568c58330486f3262d61f5534  supabase/migrations/0409_formula_versions_fuel_pump_validity.sql
          EOF
          expected="$(awk '{print $2}' "$RUNNER_TEMP/manifest.sha256" | xargs -n1 basename)"
          actual="$(ls -1 supabase/migrations/*.sql | xargs -n1 basename | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Migration directory does not contain exactly the approved 19 files in the approved order."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          sha256sum -c "$RUNNER_TEMP/manifest.sha256"
          awk '!/^#/ && NF{print $1"  "$2}' supabase/FROZEN-SOURCES.sha256 | sha256sum -c -
          echo "Package verified: commit $PINNED_SHA, 19 files, approved order, all checksums match."

  dry-run:
    name: Dry run (no database changes)
    needs: verify-package
    if: inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SHA }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Dry run against the selected target
        env:
          POOLER_URL: ${{ vars.SUPABASE_POOLER_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRM_REF: ${{ inputs.confirm_project_ref }}
          TARGET: ${{ inputs.target }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          printf '%s\n' "$PENDING_GATE_SH" > "$RUNNER_TEMP/gate.sh"; . "$RUNNER_TEMP/gate.sh"
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          # --- resolve and check target
          ref="$(printf '%s' "$POOLER_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):\[YOUR-PASSWORD\]@.*#\2#p')"
          if [ -z "$ref" ]; then
            echo "::error::Environment variable SUPABASE_POOLER_URL is missing or not in the expected Session pooler form (it must still contain [YOUR-PASSWORD])."
            exit 1
          fi
          if [ "$ref" != "$CONFIRM_REF" ]; then
            echo "::error::The project ref you typed does not match this Environment's project. Nothing was done."
            exit 1
          fi
          if [ -z "${DB_PASSWORD:-}" ]; then echo "::error::Environment secret SUPABASE_DB_PASSWORD is not set."; exit 1; fi
          enc="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')"
          echo "::add-mask::$enc"
          url="${POOLER_URL/\[YOUR-PASSWORD\]/$enc}"
          echo "::add-mask::$url"
          echo "Target project ref: $ref (environment: $TARGET)"
          # --- dry run (read-only: --dry-run only lists the applied versions; this job never calls apply)
          for f in supabase/migrations/*.sql; do basename "$f"; done | LC_ALL=C sort > "$RUNNER_TEMP/approved.txt"
          rc=0
          supabase db push --dry-run --db-url "$url" > "$RUNNER_TEMP/dry.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/dry.txt"
          if [ "$rc" -ne 0 ]; then
            echo "verdict: FAIL the Supabase CLI exited with status $rc" > "$RUNNER_TEMP/gate.txt"
          else
            pending_gate "$TARGET" "$RUNNER_TEMP/dry.txt" "$RUNNER_TEMP/approved.txt" "$PRODUCTION_EXPECTED_PENDING" > "$RUNNER_TEMP/gate.txt" || true
          fi
          verdict="$(grep '^verdict: ' "$RUNNER_TEMP/gate.txt" | tail -n 1)"
          [ -n "$verdict" ] || verdict="verdict: FAIL the gate gave no verdict"
          {
            echo "### Dry run — $TARGET ($ref)"
            echo
            echo "- Pinned package: \`$PINNED_SHA\` ($(wc -l < "$RUNNER_TEMP/approved.txt") approved files)"
            echo "- Supabase CLI: $SUPABASE_CLI_VERSION"
            echo "- Pending migrations verified from the CLI's own list ($(grep -c '^pending: ' "$RUNNER_TEMP/gate.txt" || true)):"
            grep '^pending: ' "$RUNNER_TEMP/gate.txt" | sed 's/^pending: /  - /' || echo "  - (none verified)"
            echo
            case "$verdict" in
              "verdict: PASS"*) echo "✅ ${verdict#verdict: }. This target is eligible for APPLY." ;;
              *) echo "❌ ${verdict#verdict: }. Do NOT apply." ;;
            esac
            echo
            echo "No database changes were made (dry run)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict"
          case "$verdict" in
            "verdict: PASS"*) ;;
            *) echo "::error::Dry-run gate failed: ${verdict#verdict: FAIL }"; exit 1 ;;
          esac

  apply:
    name: APPLY migrations (changes the database)
    needs: verify-package
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SHA }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Re-check target, dry run, then apply
        env:
          POOLER_URL: ${{ vars.SUPABASE_POOLER_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CONFIRM_REF: ${{ inputs.confirm_project_ref }}
          TARGET: ${{ inputs.target }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          printf '%s\n' "$PENDING_GATE_SH" > "$RUNNER_TEMP/gate.sh"; . "$RUNNER_TEMP/gate.sh"
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          ref="$(printf '%s' "$POOLER_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):\[YOUR-PASSWORD\]@.*#\2#p')"
          if [ -z "$ref" ]; then
            echo "::error::Environment variable SUPABASE_POOLER_URL is missing or not in the expected Session pooler form (it must still contain [YOUR-PASSWORD])."
            exit 1
          fi
          if [ "$ref" != "$CONFIRM_REF" ]; then
            echo "::error::The project ref you typed does not match this Environment's project. Nothing was done."
            exit 1
          fi
          if [ -z "${DB_PASSWORD:-}" ]; then echo "::error::Environment secret SUPABASE_DB_PASSWORD is not set."; exit 1; fi
          enc="$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["DB_PASSWORD"],safe=""))')"
          echo "::add-mask::$enc"
          url="${POOLER_URL/\[YOUR-PASSWORD\]/$enc}"
          echo "::add-mask::$url"
          echo "Target project ref: $ref (environment: $TARGET)"

          # 1) Fresh dry run immediately before applying.
          supabase db push --dry-run --db-url "$url" 2>&1 | tee "$RUNNER_TEMP/dry.txt"
          pending="$(grep -oE '[0-9]{4}_[a-z0-9_]+\.sql' "$RUNNER_TEMP/dry.txt" || true)"
          expected="$(ls -1 supabase/migrations/*.sql | xargs -n1 basename | LC_ALL=C sort)"
          # Eligible = the pending list is a non-empty END of the approved order (fresh project: all files).
          is_suffix() { [ -n "$1" ] && [ "$(printf '%s\n' "$2" | tail -n "$(printf '%s\n' "$1" | wc -l)")" = "$1" ]; }
          if ! is_suffix "$pending" "$expected"; then
            echo "::error::The pending list is empty or is not exactly the end of the approved order. Nothing was applied."
            exit 1
          fi
          # Independent second check: the same fail-closed gate as the dry-run job (production: exactly PRODUCTION_EXPECTED_PENDING).
          for f in supabase/migrations/*.sql; do basename "$f"; done | LC_ALL=C sort > "$RUNNER_TEMP/approved.txt"
          if ! pending_gate "$TARGET" "$RUNNER_TEMP/dry.txt" "$RUNNER_TEMP/approved.txt" "$PRODUCTION_EXPECTED_PENDING"; then
            echo "::error::The pending-migration gate failed. Nothing was applied."
            exit 1
          fi
          echo "Pending (will be applied, in order):"; printf '%s\n' "$pending" | sed 's/^/  /'

          # 2) Apply. Each file runs atomically; the CLI stops at the first error.
          supabase db push --db-url "$url" --yes 2>&1 | tee "$RUNNER_TEMP/apply.txt"

          # 3) Confirm nothing is left pending.
          supabase db push --dry-run --db-url "$url" 2>&1 | tee "$RUNNER_TEMP/after.txt"
          left="$(grep -oE '[0-9]{4}_[a-z0-9_]+\.sql' "$RUNNER_TEMP/after.txt" || true)"
          if [ -n "$left" ]; then
            echo "::error::Some migrations are still pending after apply."
            exit 1
          fi
          if ! uptodate_gate "$RUNNER_TEMP/after.txt"; then
            echo "::error::The verification dry run does not positively report the database up to date."
            exit 1
          fi
          {
            echo "### APPLY complete — $TARGET ($ref)"
            echo
            grep -E '^Applying migration' "$RUNNER_TEMP/apply.txt" | sed 's/^/- /'
            echo
            echo "Applied $(printf '%s\n' "$pending" | wc -l) approved migration(s) from commit \`$PINNED_SHA\`; nothing remains pending."
          } >> "$GITHUB_STEP_SUMMARY"
