# Gearhead Labs — calculator regression gate (Stage 1, docs/STAGE-1-TEST-INTEGRITY.md)
#
# READ-ONLY BY DESIGN. This workflow only checks out the code and runs tests in a throwaway GitHub runner.
#   - Triggers: pull requests into main, and a manual run (workflow_dispatch). It never runs on push, so it cannot run on a merge or a release.
#   - permissions: contents: read — the job token cannot push, comment, create releases, change Pages or touch any other repository setting.
#   - No secrets are referenced. Pull requests from forks get no secrets anyway.
#   - persist-credentials: false — the checkout does not leave a token in the runner's git config.
#   - No deploy, Pages, Supabase, Stripe or migration step exists here. The Supabase workflows in this folder are separate, manual and approval-gated, and are
#     not called from this file.
#   - The tests open the engine page from the checked-out files (file://) in headless Chromium; they make no requests to gearhead-labs.com or Supabase.
#
# Jobs
#   fast-gate        every pull request: register / catalog consistency, the engine self-test (with its known baseline), the independent known-answer suite for
#                    the Critical and High defects (with its known-open ledger), three fast physics/unit suites, the delivered analytics script's
#                    build and size check, and the analytics website-tracking suite (against analytics.min.js). About 10-15 minutes.
#   full-regression  manual only (Actions tab -> "Calculator tests" -> Run workflow -> full = true): the whole browser suite, about 2.5 hours.
name: Calculator tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Also run the full browser regression suite (about 2.5 hours)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calculator-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  fast-gate:
    name: Fast gate (known-answer, self-test, register)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out (read-only, no persisted token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Delivered analytics script is current and at most 8 KB gzip (analytics.min.js, docs/ANALYTICS-IMPLEMENTATION.md §1a)
        run: |
          npm ci --prefix tools/analytics-build --ignore-scripts --no-audit --no-fund
          node tools/analytics-build/build.mjs --check

      - name: Install Playwright and Chromium (test tooling only)
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          npx -y "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Register consistency (ids, fields, ledgers traced to open entries)
        run: node premium/tests/register-check.js

      - name: Catalog consistency (inventory 743 + 14, sources unchanged since generation)
        run: node catalog/check-catalog.js

      - name: Red/green proof harness rejects failed or incomplete child runs (no browser)
        run: node premium/tests/proof/red-green-harness.test.js

      - name: Ackermann reference geometry, independent check of KA-21's expected value (no browser)
        run: node premium/tests/ackermann-reference.test.js

      - name: Engine self-test (known baseline must match exactly)
        run: node premium/tests/engine-selftest.js

      - name: Known-answer suite for Critical/High defects (known-open ledger must match exactly)
        run: node premium/tests/known-answer-critical.test.js

      - name: Unit factors against exact SI definitions
        run: node premium/tests/unit-factors.test.js

      - name: Legacy fixes against independent physics
        run: node premium/tests/legacy-fixes.test.js

      - name: Numeric guard self-check
        run: node premium/tests/numeric-guard.test.js

      - name: Analytics website tracking against the delivered analytics.min.js (real Chromium, fake receiver, synthetic sessions)
        run: node premium/tests/analytics-client.test.js

  full-regression:
    name: Full browser regression (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.full
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out (read-only, no persisted token)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history: four suites read earlier versions of files with `git show <commit>:<file>` (search-authority
          # c9db895, upgrade-navigation 885f843, premium-profile 6f12a54 and 205d0c2, validation-units-imp018 d65a914).
          # A depth-1 checkout does not contain those commits.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium (test tooling only)
        run: |
          npm install -g "playwright@${PLAYWRIGHT_VERSION}"
          npx -y "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Make the site's Supabase host unreachable (this job only)
        # browser-smoke's "Supabase unreachable" cases (A1, H1 and others) send requests for *.supabase.co to the real
        # network and expect them to fail ("real network, blocked here"). A GitHub runner can reach Supabase, so the page
        # reached the live project named in supabase-config.js and reported "production". Pointing that one host at this
        # machine restores the condition the tests assume, and the regression no longer contacts the live project. The
        # runner is discarded after the job.
        run: |
          host="$(grep -oE 'https://[a-z0-9]{20}\.supabase\.co' supabase-config.js | head -n 1 | sed 's#^https://##')" || host=""
          [ -n "$host" ] || { echo "::error::no Supabase project address found in supabase-config.js"; exit 1; }
          printf '127.0.0.1 %s\n::1 %s\n' "$host" "$host" | sudo tee -a /etc/hosts > /dev/null
          addrs="$(getent ahosts "$host" | awk '{print $1}' | sort -u | tr '\n' ' ')" || addrs="(does not resolve) "
          case "$addrs" in
            "127.0.0.1 "|"127.0.0.1 ::1 "|"::1 127.0.0.1 ") ;;
            *) echo "::error::$host resolves to '$addrs', not only to this machine"; exit 1 ;;
          esac
          rc=0; curl -s -o /dev/null --max-time 10 "https://$host/rest/v1/" || rc=$?
          [ "$rc" = 7 ] || { echo "::error::$host is not refused here (curl exit $rc, expected 7: connection refused)"; exit 1; }
          echo "- $host points at this machine (connection refused) for this job only" >> "$GITHUB_STEP_SUMMARY"

      - name: Full browser regression suite
        run: bash premium/tests/run-browser-tests.sh
