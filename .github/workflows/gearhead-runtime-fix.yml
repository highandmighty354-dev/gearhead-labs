name: Gearhead Runtime Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch calculator navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = 'function filterCalcs(val){ buildNav(val); }'
          new = "function filterCalcs(val){ if(typeof ghBuildNav==='function'){ ghBuildNav(val); } else { buildNav(val); } }"
          if old in s:
              s = s.replace(old, new, 1)

          # Make the live calculator count explicit on the public home screen.
          marker = '<div class="gh-landing-kicker">GEARHEAD LABS / THE SCIENCE OF SPEED</div>'
          badge = '<div class="gh-calculator-count"><strong>${total}</strong><span>CALCULATORS</span></div>'
          if marker in s and 'class="gh-calculator-count"' not in s:
              s = s.replace(marker, marker + badge, 1)

          # Ensure the master navigation is rebuilt after every registry expansion,
          # including E1.1.0 additions loaded late in the document.
          boot_marker = '</body>'
          boot = '''<script id="GH_RUNTIME_NAV_GUARD">
(function(){
  function refresh(){
    try{
      if(typeof ghBuildNav==='function') ghBuildNav(document.getElementById('search-input')?.value||'');
      var count=document.querySelector('.gh-calculator-count strong');
      if(count && typeof CALCS!=='undefined') count.textContent=String(CALCS.filter(function(c){return c.id!=='dashboard';}).length);
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(refresh,0);});
  else setTimeout(refresh,0);
  setTimeout(refresh,500);
  setTimeout(refresh,1500);
})();
</script>
'''
          if 'id="GH_RUNTIME_NAV_GUARD"' not in s and boot_marker in s:
              s = s.replace(boot_marker, boot + boot_marker, 1)

          # Responsive polish for the count badge.
          css_marker = '</head>'
          css = '''<style id="GH_RUNTIME_NAV_GUARD_CSS">
.gh-calculator-count{display:inline-flex;align-items:baseline;gap:7px;margin:10px 0 0;padding:7px 11px;border:1px solid rgba(215,161,31,.28);border-radius:999px;background:rgba(8,10,13,.72);color:#8e969f;font-size:9px;font-weight:800;letter-spacing:.12em}.gh-calculator-count strong{color:#e1b947;font-size:14px;line-height:1}.gh-calculator-count span{font-size:8px}
</style>
'''
          if 'id="GH_RUNTIME_NAV_GUARD_CSS"' not in s and css_marker in s:
              s = s.replace(css_marker, css + css_marker, 1)

          if s == original:
              print('No patch required; leaving repository unchanged.')
          else:
              p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Gearhead Labs"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/gearhead-runtime-fix.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix calculator navigation and runtime synchronization"
          git push
